name: Sync README from template

on:
  push:
    branches:
      - releases
      - develop
    # Avoid retriggering on commits generated by this workflow.
    paths:
      - 'README.template.md'
      - '.github/workflows/sync-readme.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  render-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Allow content updates.
      pull-requests: write  # Allow pull request creation.
    # Prevent an infinite loop.
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip-ci]')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set warning text based on branch
        id: vars
        run: |
          REF_NAME="${{ github.ref_name }}"
          if [ "$REF_NAME" = "releases" ]; then
            WARNING="> This branch contains the stable release. For the development version, see the [\`develop\`](https://github.com/EERNINUO/ArbWave30/tree/develop) branch."
          elif [ "$REF_NAME" = "develop" ]; then
            WARNING="> **⚠️ Warning**: You are viewing the **develop** development branch; its contents may be unstable.\n> For a stable version, use the [releases branch](https://github.com/EERNINUO/ArbWave30/tree/releases)."
          else
            WARNING="> **ℹ️ Note**: You are viewing a non-default branch."
          fi
          echo "warning=$WARNING" >> $GITHUB_OUTPUT

      - name: Render README.md
        env:
          BRANCH_WARNING: ${{ steps.vars.outputs.warning }}
        run: |
          # Replace {{BRANCH_WARNING}} in the template with the branch-specific notice.
          sed -e "s|{{BRANCH_WARNING}}|${BRANCH_WARNING}|g" README.template.md > README.md

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs: auto-render README from template [skip-ci]"
          title: "docs: auto-update README from template"
          body: "Auto-generated PR to update README.md from template"
          branch: "auto-update-readme-${{ github.ref_name }}"
          delete-branch: true